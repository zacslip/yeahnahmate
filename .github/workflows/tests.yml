# Checks every push and pull request: the offline tests (fake WoW API, see tests/run.py) and luacheck
# (.luacheckrc). Needs no secrets, so it runs on pull requests from forks too. Uploading to CurseForge
# is a separate workflow (package.yml) that only runs on version tags.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Offline tests
        run: |
          pip install lupa
          python tests/run.py

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: luacheck
        uses: lunarmodules/luacheck@v1.2.0
        with:
          args: YeahNahMate
